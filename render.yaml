# Render Blueprint Specification for Software Dependency Impact Analyzer
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dependency-analyzer-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: RENDER_INTERNAL_SDN
        value: "True"
      - key: CORS_ORIGINS
        sync: false  # Configure with your Vercel frontend URL, e.g. https://<app>.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: dependency-analyzer-db
          property: connectionString
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "5.0"

databases:
  - name: dependency-analyzer-db
    databaseName: neondb
    user: analyzer_user
    plan: free
    region: singapore
    postgresMajorVersion: "18"
